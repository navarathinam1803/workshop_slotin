# Workshop SlotIn backend — formatting and linting (Constitution: black, ruff)
# Dependencies are in requirements.txt

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(\.git|__pycache__|\.venv|venv)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
